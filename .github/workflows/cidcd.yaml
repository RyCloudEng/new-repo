    name: conditonal job

    on: [push]

    jobs:
        jobs:
            runs-on: ubuntu-latest
            steps:
                - run: echo "hello from job 1"

        job2:
            runs-on: ubuntu-latest
            needs: job1
            if: success()
            steps:
                - run: echo "job1 failed. hello from job 3"
        job3:
            runs-on: ubuntu-latest
            needs: job1
            if: failure()                     
            steps:
                - run: echo "job1 failed. hello from job 3"

